<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stella Matutina — Territory Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0D0D0D;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    color: #CCC;
  }

  /* ── Header ─────────────────────────────────── */
  .header {
    padding: 20px 20px 10px;
    flex-shrink: 0;
  }
  .eyebrow { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: #555; margin-bottom: 4px; }
  h1 { font-family: 'Arial Black', Arial, sans-serif; font-size: clamp(13px, 2vw, 19px); color: #EEE8DF; margin-bottom: 3px; line-height: 1.2; }
  .hint { font-size: 10px; color: #444; letter-spacing: 0.5px; }

  /* ── Map: takes all remaining vertical space ─── */
  .map-wrap {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    /* touch-action: none tells the browser we handle all touch ourselves */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    min-height: 0;
  }
  #map {
    width: 100%;
    height: 100%;
    display: block;
    /* cursor changes when panning */
  }
  #map.panning { cursor: grab; }

  /* ── Legend ──────────────────────────────────── */
  .legend {
    padding: 10px 20px 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    font-size: 10px;
    color: #555;
    letter-spacing: 1px;
    text-transform: uppercase;
    align-items: center;
    flex-shrink: 0;
  }
  .leg-item { display: flex; align-items: center; gap: 8px; }
  .leg-right { margin-left: auto; color: #383838; font-size: 9px; }
  @media (max-width: 640px) { .leg-right { display: none; } }

  /* ── Tooltip ─────────────────────────────────── */
  .tooltip {
    position: fixed;
    background: #1C1C1C;
    color: #DDD8CE;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 10px 14px;
    border: 1px solid #333;
    border-radius: 4px;
    pointer-events: none;
    display: none;
    max-width: min(300px, calc(100vw - 24px));
    line-height: 1.6;
    z-index: 300;
  }
  .tooltip .tip-type {
    font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 5px; font-weight: bold;
  }
  .tooltip .tip-type.entry { color: #3D8B6A; }
  .tooltip .tip-type.exit  { color: #4A70A0; }
  .tooltip .tip-nodes {
    font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
    color: #555; margin-top: 6px;
  }

  /* ── Tap-outside dismiss (mobile tooltip) ─────── */
  .tip-dismiss {
    display: none; position: fixed; inset: 0; z-index: 299;
  }

  /* ── Reset zoom button (shows when zoomed) ──── */
  .zoom-reset {
    display: none;
    position: absolute; bottom: 16px; right: 16px;
    background: #222; border: 1px solid #444; color: #888;
    font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 7px 11px; border-radius: 3px;
    cursor: pointer; z-index: 10;
    -webkit-appearance: none;
  }
  .zoom-reset:active { background: #2A2A2A; }
</style>
</head>
<body>

<div class="header">
  <p class="eyebrow">Stella Matutina · Ecosystem</p>
  <h1>Population–Program Verticals Map</h1>
  <p class="hint" id="hint">Click any node · hover a line to read it</p>
</div>

<div class="map-wrap" id="mapWrap">
  <svg id="map" viewBox="0 0 980 600" preserveAspectRatio="xMidYMid meet"></svg>
  <button class="zoom-reset" id="zoomReset" aria-label="Reset zoom">Reset zoom</button>
</div>

<div class="legend">
  <div class="leg-item">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#3D8B6A" stroke-width="2"/></svg>
    Entry
  </div>
  <div class="leg-item">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#4A70A0" stroke-width="2" stroke-dasharray="5,3"/></svg>
    Exit
  </div>
  <div class="leg-right">click to lock · click again to release</div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="tip-dismiss" id="tipDismiss"></div>

<script>
// ── Data ─────────────────────────────────────────────────────────

const POPS = [
  { id: 'students',  label: ['Students /', 'Fellows'],    cx: 78,  cy: 300, r: 44 },
  { id: 'faculty',   label: ['Visiting', 'Faculty'],      cx: 490, cy: 62,  r: 44 },
  { id: 'labstaff',  label: ['Lab Leads /', 'Staff'],     cx: 902, cy: 300, r: 44 },
  { id: 'donors',    label: ['Donors'],                   cx: 790, cy: 528, r: 44 },
  { id: 'local',     label: ['Local', 'Population'],      cx: 190, cy: 528, r: 44 },
];

const VERTS = [
  { id: 'school',    label: 'SCHOOL',    cx: 290, cy: 205, r: 80, fill: '#2D6A4F', text: '#FFFFFF' },
  { id: 'labs',      label: 'LABS',      cx: 680, cy: 205, r: 80, fill: '#7A3B1E', text: '#FFFFFF' },
  { id: 'residency', label: 'RESIDENCY', cx: 290, cy: 420, r: 80, fill: '#1A3A5C', text: '#FFFFFF' },
  { id: 'fund',      label: 'FUND',      cx: 680, cy: 420, r: 80, fill: '#4A2D5C', text: '#FFFFFF' },
];

const CONNS = [
  // Students / Fellows
  { from:'students', to:'school',    type:'entry', short:'1–2yr curriculum',    label:'1–2 year curriculum' },
  { from:'students', to:'labs',      type:'entry', short:'Lab internship',       label:'Working in existing lab; internships; proposing own lab' },
  { from:'students', to:'residency', type:'entry', short:'Independent research', label:'Applications after residency; continuing independent research' },
  { from:'students', to:'fund',      type:'entry', short:'Project funding',      label:'Projects funded during or following programme' },
  { from:'students', to:'school',    type:'exit',  short:'Graduate to faculty',  label:'Graduation into faculty' },
  { from:'students', to:'labs',      type:'exit',  short:'Direct hire',          label:'Hired into existing lab' },
  // Visiting Faculty
  { from:'faculty', to:'school',    type:'entry', short:'Teaching visit',      label:'1 day – 1 month teaching / facilitation' },
  { from:'faculty', to:'labs',      type:'entry', short:'Own lab proposal',    label:'Working in existing lab; proposing own lab; hiring in' },
  { from:'faculty', to:'residency', type:'entry', short:'Resident teaching',   label:'Optional teaching for residents; extended independent research' },
  { from:'faculty', to:'fund',      type:'entry', short:'Funded modules',      label:'Funded module leads; selective project funding' },
  { from:'faculty', to:'school',    type:'exit',  short:'Extended teaching',   label:'Extended teaching' },
  { from:'faculty', to:'labs',      type:'exit',  short:'Direct hire',         label:'Hired into existing lab' },
  // Lab Leads / Staff
  { from:'labstaff', to:'school',    type:'entry', short:'Teach & hire',         label:'Opportunity to teach and hire talent' },
  { from:'labstaff', to:'labs',      type:'entry', short:'Lab proposals',        label:'Call for proposals and associated funding' },
  { from:'labstaff', to:'residency', type:'entry', short:'Practitioner hire',    label:'Work with practitioners; hiring or collaborations' },
  { from:'labstaff', to:'fund',      type:'entry', short:'LP fundraise',         label:'Funding + scaling opportunity; attracting LPs; raising external funding' },
  { from:'labstaff', to:'school',    type:'exit',  short:'Join as student',      label:'Becoming student / faculty' },
  { from:'labstaff', to:'labs',      type:'exit',  short:'Ongoing alignment',    label:'Continued philosophical alignment and funding' },
  { from:'labstaff', to:'residency', type:'exit',  short:'EAT engagement',       label:'EAT-style engagement' },
  // Donors
  { from:'donors', to:'school',    type:'entry', short:'Young philanthropists', label:'Recruiting young philanthropists / heirs' },
  { from:'donors', to:'labs',      type:'entry', short:'Lab fundraising',       label:'Lab leads bringing existing funders; fundraising for labs' },
  { from:'donors', to:'residency', type:'entry', short:'Patron showcase',       label:'Artists / researchers bringing existing patrons; showcasing talent in fundraising' },
  { from:'donors', to:'fund',      type:'entry', short:'Becoming LPs',          label:'Supporting wider infrastructure; philanthropists becoming LPs' },
  { from:'donors', to:'school',    type:'exit',  short:'Vision commitment',     label:'Commitment to vision' },
  // Local Population
  { from:'local', to:'school',    type:'entry', short:'Public lectures',    label:'Public lectures, workshops' },
  { from:'local', to:'labs',      type:'entry', short:'Public labs',        label:'Public lectures, workshops' },
  { from:'local', to:'residency', type:'entry', short:'Open workshops',     label:'Public lectures, workshops' },
  { from:'local', to:'fund',      type:'entry', short:'Local fundraising',  label:'Investing in local causes; local fundraising' },
  { from:'local', to:'school',    type:'exit',  short:'Local recruitment',  label:'Local recruitment' },
  { from:'local', to:'labs',      type:'exit',  short:'Local recruitment',  label:'Local recruitment' },
  { from:'local', to:'residency', type:'exit',  short:'Local recruitment',  label:'Local recruitment' },
];

const ENTRY_COLOR  = '#3D8B6A';
const EXIT_COLOR   = '#4A70A0';
const CURVE_OFFSET = 58;

// ── SVG helpers ───────────────────────────────────────────────────
const svg     = document.getElementById('map');
const mapWrap = document.getElementById('mapWrap');
const ns      = 'http://www.w3.org/2000/svg';

function el(tag, attrs = {}) {
  const e = document.createElementNS(ns, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
function append(parent, child) { parent.appendChild(child); return child; }

// ── ViewBox / zoom state ──────────────────────────────────────────
const VB_ORIG = { x: 0, y: 0, w: 980, h: 600 };
const vb = { ...VB_ORIG };
const VB_MIN_W = 180;

function applyVB() {
  svg.setAttribute('viewBox', `${vb.x.toFixed(2)} ${vb.y.toFixed(2)} ${vb.w.toFixed(2)} ${vb.h.toFixed(2)}`);
  const zoomed = vb.w < VB_ORIG.w - 10;
  zoomResetBtn.style.display = zoomed ? 'block' : 'none';
}

function clampVB() {
  vb.w = Math.max(VB_MIN_W, Math.min(VB_ORIG.w, vb.w));
  vb.h = vb.w * VB_ORIG.h / VB_ORIG.w;
  vb.x = Math.max(-80, Math.min(vb.x, VB_ORIG.w - vb.w + 80));
  vb.y = Math.max(-50, Math.min(vb.y, VB_ORIG.h - vb.h + 50));
}

function clientToSVG(cx, cy) {
  const r = svg.getBoundingClientRect();
  return {
    x: vb.x + (cx - r.left) / r.width  * vb.w,
    y: vb.y + (cy - r.top)  / r.height * vb.h,
  };
}

// ── Zoom reset ─────────────────────────────────────────────────────
const zoomResetBtn = document.getElementById('zoomReset');
zoomResetBtn.addEventListener('click',      resetZoom);
zoomResetBtn.addEventListener('touchstart', resetZoom, { passive: true });
function resetZoom() { Object.assign(vb, VB_ORIG); applyVB(); }

// ── Touch gestures: pinch-to-zoom + single-finger pan ─────────────
let pinch = null; // { dist, midClient, vbSnap }
let pan   = null; // { startClient, vbSnap, moved }

mapWrap.addEventListener('touchstart', onTouchStart, { passive: false });
mapWrap.addEventListener('touchmove',  onTouchMove,  { passive: false });
mapWrap.addEventListener('touchend',   onTouchEnd,   { passive: true  });

function pinchDist(t1, t2) {
  return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
}
function pinchMid(t1, t2) {
  return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
}

function onTouchStart(e) {
  if (e.touches.length === 2) {
    e.preventDefault();
    pan = null;
    pinch = {
      dist:     pinchDist(e.touches[0], e.touches[1]),
      midCl:    pinchMid(e.touches[0], e.touches[1]),
      vbSnap:   { ...vb },
    };
  } else if (e.touches.length === 1) {
    pan = {
      startCl: { x: e.touches[0].clientX, y: e.touches[0].clientY },
      vbSnap:  { ...vb },
      moved:   false,
    };
  }
}

function onTouchMove(e) {
  if (e.touches.length === 2 && pinch) {
    e.preventDefault();
    const newDist = pinchDist(e.touches[0], e.touches[1]);
    const newMid  = pinchMid(e.touches[0], e.touches[1]);

    // Zoom around the initial pinch midpoint in SVG coords
    const origin   = clientToSVG(pinch.midCl.x, pinch.midCl.y);
    const zoomFact = pinch.dist / newDist;
    const newW     = pinch.vbSnap.w * zoomFact;
    const newH     = newW * VB_ORIG.h / VB_ORIG.w;
    vb.w = newW;
    vb.h = newH;
    vb.x = origin.x - (origin.x - pinch.vbSnap.x) * (newW / pinch.vbSnap.w);
    vb.y = origin.y - (origin.y - pinch.vbSnap.y) * (newH / pinch.vbSnap.h);

    // Also translate with pinch midpoint movement
    const r = svg.getBoundingClientRect();
    vb.x += (pinch.midCl.x - newMid.x) * vb.w / r.width;
    vb.y += (pinch.midCl.y - newMid.y) * vb.h / r.height;

    clampVB(); applyVB();

  } else if (e.touches.length === 1 && pan) {
    const touch = e.touches[0];
    const dx = touch.clientX - pan.startCl.x;
    const dy = touch.clientY - pan.startCl.y;

    if (Math.hypot(dx, dy) > 6) pan.moved = true;

    // Only pan when zoomed in, to allow page scroll otherwise
    if (pan.moved && vb.w < VB_ORIG.w - 10) {
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      vb.x = pan.vbSnap.x - dx * vb.w / r.width;
      vb.y = pan.vbSnap.y - dy * vb.h / r.height;
      clampVB(); applyVB();
    }
  }
}

function onTouchEnd(e) {
  if (e.touches.length < 2) pinch = null;
  if (e.touches.length === 0) {
    // Double-tap to reset zoom
    const now = Date.now();
    if (now - (mapWrap._lastTap || 0) < 280 && !pan?.moved) {
      resetZoom();
    }
    mapWrap._lastTap = now;
    pan = null;
  }
}

// Mouse-wheel zoom (desktop)
mapWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.12 : 0.89;
  const origin = clientToSVG(e.clientX, e.clientY);
  vb.w *= factor; vb.h = vb.w * VB_ORIG.h / VB_ORIG.w;
  vb.x  = origin.x - (origin.x - vb.x) * factor;
  vb.y  = origin.y - (origin.y - vb.y) * factor;
  clampVB(); applyVB();
}, { passive: false });

// ── Tooltip ───────────────────────────────────────────────────────
const tipEl      = document.getElementById('tooltip');
const tipDismiss = document.getElementById('tipDismiss');

function positionTooltip(clientX, clientY) {
  requestAnimationFrame(() => {
    const tw = tipEl.offsetWidth  || 220;
    const th = tipEl.offsetHeight || 60;
    tipEl.style.left = Math.min(Math.max(clientX - tw / 2, 8), window.innerWidth  - tw - 8) + 'px';
    tipEl.style.top  = Math.max(clientY - th - 18, 8) + 'px';
  });
}

document.addEventListener('mousemove', e => {
  if (tipEl.style.display === 'block') positionTooltip(e.clientX, e.clientY);
});

function formatLabel(label) {
  if (!label.includes(';') && !label.includes(',')) return label;
  if (label.includes(';')) {
    return label.split(';').map(s => {
      const t = s.trim();
      return '– ' + t.charAt(0).toUpperCase() + t.slice(1);
    }).join('<br>');
  }
  return label;
}

function showTooltip(conn, clientX, clientY) {
  const color  = conn.type === 'entry' ? ENTRY_COLOR : EXIT_COLOR;
  const popLbl = POPS.find(p => p.id === conn.fromId)?.label.join(' ') ?? conn.fromId;
  const vrtLbl = VERTS.find(v => v.id === conn.toId)?.label ?? conn.toId;
  tipEl.innerHTML =
    `<div class="tip-type ${conn.type}">${conn.type.toUpperCase()}</div>` +
    formatLabel(conn.label) +
    `<div class="tip-nodes">${popLbl} → ${vrtLbl}</div>`;
  tipEl.style.borderColor = color;
  tipEl.style.display = 'block';
  if (clientX !== undefined) positionTooltip(clientX, clientY);
  tipDismiss.style.display = 'block';
}

function hideTooltip() {
  tipEl.style.display     = 'none';
  tipDismiss.style.display = 'none';
}

tipDismiss.addEventListener('touchstart', hideTooltip, { passive: true });
tipDismiss.addEventListener('click',      hideTooltip);

// ── Background ────────────────────────────────────────────────────
function drawBackground() {
  append(svg, el('rect', { width: 980, height: 600, fill: '#0D0D0D', rx: 4 }));
  for (let x = 40; x < 980; x += 40)
    for (let y = 40; y < 600; y += 40)
      append(svg, el('circle', { cx: x, cy: y, r: 0.8, fill: '#222' }));
  append(svg, el('text', {
    x: 485, y: 318, fill: '#1A1A1A',
    'font-family': 'Arial Black, Arial', 'font-size': 11,
    'font-weight': 900, 'text-anchor': 'middle', 'letter-spacing': 6,
  })).textContent = 'STELLA';
}

// ── Bezier path ───────────────────────────────────────────────────
function bezierPath(fromNode, toNode, type) {
  const dx = toNode.cx - fromNode.cx, dy = toNode.cy - fromNode.cy;
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const sx = fromNode.cx + (dx/dist)*fromNode.r, sy = fromNode.cy + (dy/dist)*fromNode.r;
  const ex = toNode.cx   - (dx/dist)*toNode.r,   ey = toNode.cy   - (dy/dist)*toNode.r;
  const mx = (sx+ex)/2, my = (sy+ey)/2;
  const px = -dy/dist, py = dx/dist;
  const sign = type === 'entry' ? 1 : -1;
  const cx = mx + sign*px*CURVE_OFFSET, cy = my + sign*py*CURVE_OFFSET;
  const lx = 0.25*sx + 0.5*cx + 0.25*ex;
  const ly = 0.25*sy + 0.5*cy + 0.25*ey;
  return {
    d: `M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`,
    labelX: lx, labelY: ly,
  };
}

// ── Connections ───────────────────────────────────────────────────
const connEls = [];

function drawConnections() {
  const pathLayer  = append(svg, el('g'));
  const labelLayer = append(svg, el('g'));

  CONNS.forEach(conn => {
    const from = POPS.find(p => p.id === conn.from);
    const to   = VERTS.find(v => v.id === conn.to);
    const { d, labelX, labelY } = bezierPath(from, to, conn.type);
    const color = conn.type === 'entry' ? ENTRY_COLOR : EXIT_COLOR;

    const path = el('path', {
      d, fill: 'none', stroke: color,
      'stroke-width': 1.5, 'stroke-opacity': 0.18,
      'stroke-dasharray': conn.type === 'exit' ? '5,4' : 'none',
      'pointer-events': 'none',
    });
    append(pathLayer, path);

    // Short label: halo + coloured text
    const lblGrp = append(labelLayer, el('g', { opacity: 0.82, 'pointer-events': 'none' }));
    const ta = {
      x: labelX.toFixed(1), y: labelY.toFixed(1),
      'font-family': 'Courier New, monospace', 'font-size': 9,
      'font-weight': 'bold', 'text-anchor': 'middle',
      'dominant-baseline': 'middle', 'letter-spacing': 0.8,
    };
    const halo = el('text', { ...ta, fill: 'none', stroke: '#0A0A0A', 'stroke-width': 4, 'stroke-linejoin': 'round' });
    halo.textContent = conn.short;
    append(lblGrp, halo);
    const lbl = el('text', { ...ta, fill: color });
    lbl.textContent = conn.short;
    append(lblGrp, lbl);

    // Hit target (wider invisible stroke)
    const hit = el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 20 });
    hit.style.cursor = 'pointer';
    append(pathLayer, hit);

    const entry = {
      path, hit, lblGrp,
      fromId: conn.from, toId: conn.to,
      type: conn.type, label: conn.label,
      dimmed: false, _ao: 0.18, _aw: 1.5,
    };
    connEls.push(entry);

    // Mouse hover
    hit.addEventListener('mouseenter', () => {
      if (entry.dimmed) return;
      path.setAttribute('stroke-opacity', 1.0);
      path.setAttribute('stroke-width',   2.5);
      showTooltip(entry);
    });
    hit.addEventListener('mouseleave', () => {
      if (entry.dimmed) return;
      path.setAttribute('stroke-opacity', entry._ao);
      path.setAttribute('stroke-width',   entry._aw);
      hideTooltip();
    });

    // Touch tap on path (show tooltip above finger)
    hit.addEventListener('touchstart', e => {
      if (entry.dimmed || pan?.moved || pinch) return;
      e.stopPropagation();
      const t = e.changedTouches[0];
      path.setAttribute('stroke-opacity', 1.0);
      path.setAttribute('stroke-width',   2.5);
      showTooltip(entry, t.clientX, t.clientY);
    }, { passive: true });
    hit.addEventListener('touchend', () => {
      if (entry.dimmed) return;
      setTimeout(() => {
        path.setAttribute('stroke-opacity', entry._ao);
        path.setAttribute('stroke-width',   entry._aw);
      }, 1800);
    }, { passive: true });
  });
}

// ── Verticals ─────────────────────────────────────────────────────
const vertEls = {};

function drawVerticals() {
  const g = append(svg, el('g'));
  VERTS.forEach(v => {
    const grp = append(g, el('g'));
    grp.style.cursor = 'pointer';
    append(grp, el('circle', { cx:v.cx, cy:v.cy, r:v.r+10, fill:'none', stroke:v.fill, 'stroke-width':1, 'stroke-opacity':0.25 }));
    append(grp, el('circle', { cx:v.cx, cy:v.cy, r:v.r, fill:v.fill, stroke:v.fill, 'stroke-width':2 }));
    append(grp, el('text', {
      x:v.cx, y:v.cy+4, fill:v.text,
      'font-family':'Arial Black, Arial',
      'font-size': v.label === 'RESIDENCY' ? 10.5 : 12.5,
      'font-weight':900, 'text-anchor':'middle', 'letter-spacing':2, 'pointer-events':'none',
    })).textContent = v.label;
    vertEls[v.id] = grp;
    grp.addEventListener('mouseenter', () => { if (!locked) applyHighlight('vert', v.id); });
    grp.addEventListener('mouseleave', () => { if (!locked) resetHighlight(); });
    grp.addEventListener('click',      () => { if (!pan?.moved) lockToggle('vert', v.id); });
  });
}

// ── Populations ───────────────────────────────────────────────────
const popEls = {};

function drawPopulations() {
  const g = append(svg, el('g'));
  POPS.forEach(p => {
    const grp = append(g, el('g'));
    grp.style.cursor = 'pointer';
    append(grp, el('circle', { cx:p.cx, cy:p.cy, r:p.r, fill:'#1E1E1E', stroke:'#555', 'stroke-width':1.5 }));
    p.label.forEach((line, i) => {
      const off = p.label.length === 1 ? 0 : (i - (p.label.length-1)/2) * 13;
      append(grp, el('text', {
        x:p.cx, y:p.cy+off+4, fill:'#CCC',
        'font-family':'Courier New, monospace', 'font-size':9.5,
        'font-weight':'bold', 'text-anchor':'middle', 'pointer-events':'none', 'letter-spacing':0.5,
      })).textContent = line;
    });
    popEls[p.id] = grp;
    grp.addEventListener('mouseenter', () => { if (!locked) applyHighlight('pop', p.id); });
    grp.addEventListener('mouseleave', () => { if (!locked) resetHighlight(); });
    grp.addEventListener('click',      () => { if (!pan?.moved) lockToggle('pop', p.id); });
  });
}

// ── Interaction ───────────────────────────────────────────────────
let locked = null;

function lockToggle(kind, id) {
  if (locked && locked.kind === kind && locked.id === id) {
    locked = null; resetHighlight();
  } else {
    locked = { kind, id }; applyHighlight(kind, id);
  }
}

function applyHighlight(kind, id) {
  connEls.forEach(c => {
    const active = kind === 'pop' ? c.fromId === id : c.toId === id;
    c.dimmed = !active;
    if (active) {
      c._ao = 0.85; c._aw = 2.0;
      c.path.setAttribute('stroke-opacity', 0.85);
      c.path.setAttribute('stroke-width',   2.0);
      c.lblGrp.setAttribute('opacity', 1.0);
      c.hit.style.pointerEvents = 'auto';
    } else {
      c.path.setAttribute('stroke-opacity', 0.0);
      c.path.setAttribute('stroke-width',   1.0);
      c.lblGrp.setAttribute('opacity', 0);
      c.hit.style.pointerEvents = 'none';
    }
  });
  POPS.forEach(p => {
    const active = kind === 'pop'
      ? p.id === id
      : connEls.some(c => c.toId === id && c.fromId === p.id);
    popEls[p.id].style.opacity = active ? 1 : 0.15;
  });
  VERTS.forEach(v => {
    const active = kind === 'vert'
      ? v.id === id
      : connEls.some(c => c.fromId === id && c.toId === v.id);
    vertEls[v.id].style.opacity = active ? 1 : 0.12;
  });
}

function resetHighlight() {
  hideTooltip();
  connEls.forEach(c => {
    c.dimmed = false; c._ao = 0.18; c._aw = 1.5;
    c.path.setAttribute('stroke-opacity', 0.18);
    c.path.setAttribute('stroke-width',   1.5);
    c.lblGrp.setAttribute('opacity', 0.82);
    c.hit.style.pointerEvents = 'auto';
  });
  POPS.forEach(p  => { popEls[p.id].style.opacity  = 1; });
  VERTS.forEach(v => { vertEls[v.id].style.opacity = 1; });
}

// ── Detect touch device and update hint ───────────────────────────
if (window.matchMedia('(pointer: coarse)').matches) {
  document.getElementById('hint').textContent =
    'Tap any node · pinch to zoom · tap a line to read it';
}

// ── Init ──────────────────────────────────────────────────────────
drawBackground();
drawConnections();
drawVerticals();
drawPopulations();
applyVB();
</script>
